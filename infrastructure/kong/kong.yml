# Kong Configuration for Automation Platform API Gateway
_format_version: "3.0"

services:
  - name: automation-api
    url: http://api:3000
    plugins:
      - name: rate-limiting
        config:
          minute: 100
          hour: 1000
          policy: local
      - name: cors
        config:
          origins:
            - "http://localhost:3000"
            - "https://app.automation-platform.com"
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - PATCH
            - OPTIONS
          headers:
            - Accept
            - Accept-Version
            - Content-Length
            - Content-Type
            - Date
            - Authorization
          credentials: true
          max_age: 3600
      - name: request-transformer
        config:
          add:
            headers:
              - "X-Gateway-Source:Kong"
              - "X-Request-ID:$(uuid)"

routes:
  - name: api-routes
    service: automation-api
    paths:
      - /api
    strip_path: false
    
  - name: health-routes
    service: automation-api
    paths:
      - /health
    strip_path: false

  # Webhook routes with special handling
  - name: webhook-routes
    service: automation-api
    paths:
      - /api/webhooks
    methods:
      - POST
    plugins:
      - name: rate-limiting
        config:
          minute: 1000
          hour: 10000
          policy: local
      - name: request-size-limiting
        config:
          allowed_payload_size: 50

  # Authentication routes with stricter rate limiting
  - name: auth-routes
    service: automation-api
    paths:
      - /api/auth
    plugins:
      - name: rate-limiting
        config:
          minute: 10
          hour: 100
          policy: local

# Global plugins
plugins:
  - name: prometheus
    config:
      per_consumer: false
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true

  - name: file-log
    config:
      path: /var/log/kong/access.log
      format: |
        {
          "timestamp": "$time_iso8601",
          "client_ip": "$remote_addr",
          "method": "$request_method",
          "uri": "$request_uri",
          "status": "$status",
          "size": "$body_bytes_sent",
          "user_agent": "$http_user_agent",
          "request_time": "$request_time",
          "upstream_response_time": "$upstream_response_time"
        }

  - name: tcp-log
    config:
      host: logstash
      port: 5000
      keepalive: 60000