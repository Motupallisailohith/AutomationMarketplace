[package]
name = "rust-worker"
version = "0.1.0"
edition = "2021"
authors = ["Automation Marketplace Team"]
description = "Rust worker for high-performance computational activities"

[dependencies]
temporal-sdk = "0.1.0"
temporal-sdk-core = "0.1.0"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rayon = "1.7"
ndarray = "0.15"
ndarray-rand = "0.14"
rand = "0.8"
rand_distr = "0.4"
num-complex = "0.4"
rustfft = "6.0"
image = "0.24"
regex = "1.0"
csv = "1.2"
reqwest = { version = "0.11", features = ["json"] }
futures = "0.3"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "computation_benchmarks"
harness = false